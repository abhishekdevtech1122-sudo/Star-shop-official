<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- चमकीला और वाइब्रेंट रूबी रेड ग्रेडिएंट (छत के लिए) -->
    <linearGradient id="roofRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#C70000"/>
    </linearGradient>

    <!-- एकदम ब्राइट और हाई-कॉन्ट्रास्ट गोल्डन-येलो (दुकान के बेस के लिए) -->
    <linearGradient id="storeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- खिड़की और दरवाजे के लिए सुपर-ग्लो सायन/ब्लू -->
    <linearGradient id="glassBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- डीप रिच ब्लैक बैकग्राउंड जो गोल्डन फ्रेम और रंगों को और ज्यादा उभारेगा -->
    <linearGradient id="bgBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- शैडो और पॉप-अप इफ़ेक्ट -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- डार्क बेस बैकग्राउंड -->
  <rect width="512" height="512" rx="116" fill="url(#bgBlack)" stroke="#FFD700" stroke-width="8"/>

  <!-- मुख्य स्टोर आइकॉन (आँखों में चुभने वाला बोल्ड और शार्प लुक) -->
  <g filter="url(#popShadow)">
    <!-- बेस प्लेटफॉर्म -->
    <rect x="100" y="380" width="312" height="24" rx="6" fill="#E0E0E0"/>

    <!-- दुकान का मुख्य पीला हिस्सा -->
    <path d="M 120 220 L 120 380 L 392 380 L 392 220 Z" fill="url(#storeYellow)"/>

    <!-- बड़ी खिड़की (लेफ्ट साइड) -->
    <rect x="150" y="250" width="90" height="90" rx="10" fill="url(#glassBlue)" stroke="#111111" stroke-width="6"/>
    <path d="M 175 250 L 150 280" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M 215 250 L 150 325" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- दरवाजा (राइट साइड) -->
    <rect x="272" y="230" width="90" height="150" rx="8" fill="url(#glassBlue)" stroke="#111111" stroke-width="6"/>
    <circle cx="292" cy="305" r="8" fill="#111111"/>

    <!-- लाल और सफेद धारियों वाली छत (Awning) -->
    <path d="M 80 140 Q 256 100 432 140 L 412 220 L 100 220 Z" fill="url(#roofRed)" stroke="#111111" stroke-width="6"/>
    <!-- छत की धारियां (Stripes) -->
    <path d="M 160 123 L 150 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
    <path d="M 256 112 L 256 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
    <path d="M 352 123 L 362 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
यह वाला लोगो ही बढ़िया लग रहा है यार
